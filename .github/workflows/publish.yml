name: publish-images

# Construye api/web/tools una sola vez y las publica en GHCR. Los servidores sólo
# hacen `docker compose pull` (ver scripts/deploy.sh), evitando el build local.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/api.Dockerfile
            target: runtime
            scope: api
          - name: web
            dockerfile: infra/web.Dockerfile
            target: runtime
            scope: web
          - name: tools
            dockerfile: infra/api.Dockerfile
            target: tools
            scope: tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fecha de build
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            API_TARGET=http://api:3001
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ppg-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ppg-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

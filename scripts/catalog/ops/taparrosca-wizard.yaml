# Wizard Taparrosca con Pincel (Modelo B)
# - Fusiona Altura de Taparrosca dentro de Forma de Taparrosca (el numero es la forma)
# - Bala conserva nombre; su altura va a notas. Rebeca sin altura.
# - Elimina la variante errónea TPR-0016 (13mm Yadis 38mm).
# - 'Color de Tapa con Pincel' y 'Altura de Taparrosca' se conservan (los usa 'Tapa con Pincel').

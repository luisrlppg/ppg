version: 1
name: pigmentos
description: >
  Alta del producto Pigmento (comprable, uom kg) con 4 ejes: Resina (PP/PE, PVC),
  Tipo (Polvo, Masterbatch), Color y Fabricante. Se materializan los 30 pigmentos
  diferidos de Odoo con Resina+Color (Tipo/Fabricante se capturan después).
ops:
  - { op: category.ensure, nombre: Pigmentos }

  - op: product.define
    nombre: Pigmento
    sku: PIG
    uom: kg
    category: Pigmentos
    hasVariants: true
    comprable: true
    fabricable: false
    vendible: false

  - { op: attr.ensure, name: Resina de Pigmento, values: ["PP/PE", "PVC"] }
  - { op: attr.ensure, name: Tipo de Pigmento, values: ["Polvo", "Masterbatch"] }
  - op: attr.ensure
    name: Color de Pigmento
    values:
      - Café chocolate
      - Hueso de mamey
      - Morado hipoalergénico
      - Rosa silicon
      - Lila
      - Negro
      - Master rosa
      - Gris
      - Master naranja RoHS
      - Rosa
      - Azul nacar
      - Master café
      - Master 9201
      - Blanco
      - Verde
      - Morado
      - Rosa 8 en 1
      - Beige
      - Azul
      - Rosa hueso de mamey
  - { op: attr.ensure, name: Fabricante de Pigmento }

  - { op: attr.assignAxis, product: Pigmento, attribute: Resina de Pigmento, sortOrder: 1 }
  - { op: attr.assignAxis, product: Pigmento, attribute: Tipo de Pigmento, sortOrder: 2 }
  - { op: attr.assignAxis, product: Pigmento, attribute: Color de Pigmento, sortOrder: 3 }
  - { op: attr.assignAxis, product: Pigmento, attribute: Fabricante de Pigmento, sortOrder: 4 }

  - { op: attr.restrictValues, product: Pigmento, attribute: Resina de Pigmento, values: ["PP/PE", "PVC"] }
  - { op: attr.restrictValues, product: Pigmento, attribute: Tipo de Pigmento, values: ["Polvo", "Masterbatch"] }

  # --- PP/PE (17) ---

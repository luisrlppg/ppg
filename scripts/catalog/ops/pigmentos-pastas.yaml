version: 1
name: pigmentos-pastas
description: >
  Completa la migración de pigmentos de Odoo. Carga las 39 pastas de color con
  stock real en las ubicaciones PIG1/PIG2/PIG3 (63.45 kg) como variantes del
  producto Pigmento (Color = nombre), carga el stock de pp 1992 (25 kg) en
  Principal y elimina las 29 variantes codificadas que quedaron sin stock.
ops:
  - { op: location.ensure, nombre: PIG1 }
  - { op: location.ensure, nombre: PIG2 }
  - { op: location.ensure, nombre: PIG3 }

  - op: attr.ensure
    name: Color de Pigmento
    values:
      - Amanecer
      - Amarillo Amarelo
      - Azul Navy
      - Azul Nectarin
      - Azul Oceano
      - Cafe Galleta
      - Granberry
      - Mamey
      - Morado Satin
      - Naranja Raspberry
      - Naranja Passion Fruit
      - Palo De Rosa I
      - Palo De Rosa II
      - Pome Granate
      - Red Blood
      - Rojo V
      - Rosa II
      - Rosa Bombon
      - Rosa Bugambilia
      - Rosa Cuarzo
      - Rosa Gliter
      - Rosa Grape Fruit
      - Rosa Uñas
      - Satinado Sara
      - Tutifruti I
      - Tutifruti II
      - Verde Aqua I
      - Verde Convite
      - Verde Lemoncino
      - Vino
      - Violeta Blackberry
      - Watermelon
      - Coral Confeti
      - Amarillo Barradas
      - Azul Barradas
      - Rosa I
      - Verde Aqua II
      - Verde Barradas


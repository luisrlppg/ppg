services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppg}
      POSTGRES_DB: ${POSTGRES_DB:-ppg}
    ports:
      # Configurable para no chocar con un PostgreSQL nativo (ej. POSTGRES_PORT=5433).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # En PostgreSQL 18+ el volumen va en /var/lib/postgresql (no .../data).
      - pgdata:/var/lib/postgresql
      # Respaldos compartidos con el host, disponibles DENTRO de postgres para
      # pg_dump/pg_restore/psql (scripts/deploy.sh restore).
      - ./docs/backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppg} -d ${POSTGRES_DB:-ppg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Perfil "full": despliegue completo (api + web; web es la entrada única).
  # Dev local: basta con `docker compose up -d postgres`.
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ppg}:${POSTGRES_PASSWORD:-ppg}@postgres:5432/${POSTGRES_DB:-ppg}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      COOKIE_NAME: ppg_session
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      API_PORT: 3001
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      # Acceso directo a la API (depuración). Puerto host configurable con API_HOST_PORT.
      - "${API_HOST_PORT:-3001}:3001"
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Respaldos compartidos con el host para la UI (crear/listar/restaurar).
      - ./docs/backups:/app/docs/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s
    restart: unless-stopped

  # Entrada única del stack: publica la web y proxya /api/* al servicio `api`.
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        API_TARGET: http://api:3001
    environment:
      # Horneado en build (rewrites de Next); se repite en runtime por claridad.
      API_TARGET: http://api:3001
    ports:
      # Entrada del stack. Puerto host configurable con WEB_HOST_PORT.
      - "${WEB_HOST_PORT:-8090}:3000"
    profiles: ["full"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Perfil "tools": bootstrap manual de autenticación (migra + siembra roles/usuarios).
  # El catálogo ya NO vive aquí: usa el seed declarativo (`pnpm cat:seed`) o un
  # respaldo completo (UI Respaldos / scripts/deploy.sh restore).
  # Uso: docker compose --profile tools run --rm seed
  seed:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command:
      - sh
      - -lc
      - cd packages/db && node node_modules/prisma/build/index.js migrate deploy && node node_modules/tsx/dist/cli.mjs prisma/seed.ts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ppg}:${POSTGRES_PASSWORD:-ppg}@postgres:5432/${POSTGRES_DB:-ppg}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ppg
      POSTGRES_PASSWORD: ppg
      POSTGRES_DB: ppg
    ports:
      # Configurable para no chocar con un PostgreSQL nativo (ej. POSTGRES_PORT=5433).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # En PostgreSQL 18+ el volumen va en /var/lib/postgresql (no .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppg -d ppg"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Perfil "full": despliegue completo (api + web; web es la entrada única).
  # Dev local: basta con `docker compose up -d postgres`.
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://ppg:ppg@postgres:5432/ppg?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      COOKIE_NAME: ppg_session
      API_PORT: 3001
    ports:
      # Acceso directo a la API (depuración). Puerto host configurable con API_HOST_PORT.
      - "${API_HOST_PORT:-3001}:3001"
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Respaldos compartidos con el host para la UI (crear/listar/restaurar).
      - ./docs/backups:/app/docs/backups
    restart: unless-stopped

  # Entrada única del stack: publica la web y proxya /api/* al servicio `api`.
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        API_TARGET: http://api:3001
    environment:
      # Horneado en build (rewrites de Next); se repite en runtime por claridad.
      API_TARGET: http://api:3001
    ports:
      # Entrada del stack. Puerto host configurable con WEB_HOST_PORT.
      - "${WEB_HOST_PORT:-8090}:3000"
    profiles: ["full"]
    depends_on:
      - api
    restart: unless-stopped

  # Perfil "tools": siembra inicial manual (migra + puebla usuarios/catálogo).
  # No arranca con "full". Uso: docker compose --profile tools run --rm seed
  seed:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command:
      - sh
      - -lc
      - cd packages/db && node node_modules/prisma/build/index.js migrate deploy && node node_modules/tsx/dist/cli.mjs prisma/seed.ts
    environment:
      DATABASE_URL: postgresql://ppg:ppg@postgres:5432/ppg?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
